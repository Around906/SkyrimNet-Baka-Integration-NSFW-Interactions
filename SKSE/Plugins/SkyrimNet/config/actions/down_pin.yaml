name: PinHelpless
description: |
  Pin and physically restrain a DOWNED victim — grab, hold, and manhandle a defeated target into submission while they lie helpless on the ground. Use to subdue or assert control over a beaten enemy. Valid while combat is still nominally live.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PinHelpless_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The aggressor acting on the downed, helpless victim.
  - type: dynamic
    name: akTarget
    description: The defeated victim lying helpless on the ground.

enabled: true
defaultPriority: 3
customCategory: SNBaka_Downed
eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
