name: Pose
description: |
  Hold a solo body pose or gesture for a while. No target, no dialogue. Ends on its own, or if a
  fight starts.

  Pick poseName to match the moment:
    Kneel       - kneeling before someone of higher status, praying, surrendering, pledging, begging
    Dogeza      - full grovelling floor-bow: apologizing profusely, begging forgiveness, total submission
    Meditate    - meditating, praying, steadying yourself, an unhurried quiet moment
    Crouch      - hiding, sneaking, taking cover, examining something on the ground
    Sleep       - bedding down, exhausted, resting at camp, sleeping rough
    ScratchHead - confused, embarrassed, unsure, caught out, thinking out loud
    BraceArm    - shy, nervous, uneasy, bracing yourself, waiting awkwardly
    HandOnFace  - shocked, dismayed, worried, overwhelmed, hiding your reaction
    HandOnChin  - thinking, appraising, sizing someone up, deciding, skeptical
    Drool       - dazed, dumbstruck, mind-blanked, smitten, stupefied
    Autograph   - miming signing an autograph (a fan or admirer asks, showing off fame)
    Pickpocket  - slipping a hand into a pocket or pouch, stealing, sleight of hand
    Aroused     - shifting with visible arousal, restless heated body language
    Drink       - FEMALE ONLY: taking a drink at a tavern/feast; may end in a drunken blackout
    Food        - FEMALE ONLY: reacting to food or drink put in front of you, eat or recoil

questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: Pose_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The character holding the pose.
  - type: dynamic
    name: poseName
    description: "One of: Kneel, Dogeza, Meditate, Crouch, Sleep, ScratchHead, BraceArm, HandOnFace, HandOnChin, Drool, Autograph, Pickpocket, Aroused, Drink, Food"

enabled: true
defaultPriority: 2
customCategory: SNBaka_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
