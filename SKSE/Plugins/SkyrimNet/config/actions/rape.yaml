name: Rape
description: |
  THE action to force a DOWNED / defeated victim into sex. Call it what it is. ALWAYS use this — not a
  normal/consensual "start sex" action — when the target is downed: it plays the proper defeat takedown
  (choke-hold -> aggressive scene, positioning, tears, and it keeps combat suppressed so the game doesn't
  crash). A generic sex action on a defeated victim skips all of that and is wrong here.

  CALL FORMAT: ACTION: Rape PARAMS: {"akTarget": "<target's name>"} — that is the ONLY field. Do NOT
  copy a "start sex" action's params (no "activity", "participant1", "participant2" — a call shaped
  like that is not this action and will be silently discarded).

  The initiator moves in on a defeated, helpless victim who is down on the ground.
  VALID whenever the target is downed — the target's get_baka_state decorator shows
  "downed_and_vulnerable": true (or "on_ground": true). That covers a Baka QTE defeat
  AND a target left bleeding out / defeated by ANYTHING ELSE (combat defeat, the
  Surrender mod, etc.). The victim cannot resist.

  DECISION CONTEXT — THIS IS A FORCED CHOICE MOMENT:
  When the target reads as downed_and_vulnerable / on_ground, the attacker MUST choose exactly ONE of
  three outcomes: Rape (this action), HelpUp (show mercy, stand them up), or Release (step back,
  let the moment pass). This is not optional narration — it is the active decision window. The attacker
  stands over a helpless target and decides what to do next. Pick one. Do not stay silent.

  WHEN A CHARACTER WOULD DO THIS:
  - A dominant, predatory character who sees an opportunity and takes it
  - An NPC who just physically overpowered the target and wants to push further
  - A character who was waiting for the target to be vulnerable
  - An opportunist who was nearby and sees the target helpless on the ground

  PERSONALITY TYPES WHO WOULD DO THIS:
  - Predatory, dominant, or power-hungry
  - Lacking restraint or moral hesitation in this moment
  - Sexually aggressive or coercive by nature
  - Emboldened by having just seen the target defeated

  DO NOT USE:
  - If the target is not currently downed/defeated (the Papyrus function checks the
    downed/bleeding-out state and silently no-ops if conditions are not met)
  - If the target's sex is excluded by the MCM's target-sex setting (silently no-ops)
  - In public or crowded areas unless the character is reckless
  - For characters who are honourable, protective, or would be repulsed by assault
  - Use Release instead if the character has any hesitation or moral restraint

  CONSEQUENCES:
  - Plays DefeatResist chokehold animation on both actors
  - SexLab aggressive scene begins immediately after the choke animation

questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: Escalate_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The NPC choosing to rape the downed target.
  - type: dynamic
    name: akTarget
    description: The defeated target lying helpless on the ground.

enabled: true
defaultPriority: 10
customCategory: SNBaka_Downed
eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
