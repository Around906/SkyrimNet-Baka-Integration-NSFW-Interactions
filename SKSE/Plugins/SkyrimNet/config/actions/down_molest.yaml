name: GropeHelpless
description: |
  Grope and molest a DOWNED, helpless victim from behind against their will while they lie defeated on the ground. A SEXUAL, degrading act exploiting a beaten target who cannot resist. Valid even mid-combat.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: BackHugMolest_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The aggressor acting on the downed, helpless victim.
  - type: dynamic
